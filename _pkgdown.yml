url: https://statmodels7.github.io/statmodels7/

template:
  bootstrap: 5

reference:
- title: The toolkit
  desc: >
    Which packages the toolkit is made of, at which versions, and whether any
    of their exports mask one another.
  contents:
  - statmodels7_packages
  - statmodels7_versions
  - statmodels7_conflicts

- title: Specifying a model
  desc: >
    One formula carries every parameter of the distribution, the equations
    separated by a bar, and each equation's terms come from modelterms7.
  contents:
  - statmod_spec
  - statmod_equations
  - statmod_design

- title: Fitting
  desc: >
    One formula, one distribution, and a scheme that fits the terms whose
    penalties are differentiable all together while the others are alternated
    around them.
  contents:
  - statmod
  - iwls
  - rstatmod

- title: Reading a fit
  desc: >
    The model as a function of parameters and data, any parameter or moment
    predicted at new data, what the fit says about its own uncertainty, and the
    elapsed time in the unit it deserves.
  contents:
  - loglik
  - format_duration

- title: Installing and updating
  desc: >
    The toolkit is not on CRAN, so the install path is GitHub and the
    dependencies among the members are resolved by pak.
  contents:
  - statmodels7_update

- title: Internals
  desc: >
    The machinery the exported functions are built from. None of it is
    exported, and none is needed to use the package.
  contents:
  - has_keyword("internal")
