url: https://statmodels7.github.io/statmodels7/

template:
  bootstrap: 5

reference:
- title: The toolkit
  desc: >
    The packages of which the toolkit is made, their versions, and whether any
    of their exports mask one another.
  contents:
  - statmodels7_packages
  - statmodels7_versions
  - statmodels7_conflicts

- title: Specifying a model
  desc: >
    One formula carries the equations of all the parameters of the
    distribution, separated by a bar, and the terms of each equation come
    from modelterms7.
  contents:
  - statmod_spec
  - statmod_equations
  - statmod_design

- title: Fitting
  desc: >
    One formula and one distribution. The coefficients of the terms with a
    differentiable penalty are fitted in one system, together with a
    score-driven term, and the terms with a kinked penalty and the regime
    terms are alternated with that system. The section also holds the inner
    method, the criteria for the hyperparameters and the simulator.
  contents:
  - statmod
  - linpar_options
  - iwls
  - reml
  - aic
  - cv
  - rstatmod
  - print.StatmodSim

- title: The information matrix and the solver
  desc: >
    The matrix that the inner fit inverts, that enters a Laplace determinant
    or that gives the standard errors is passed as an object: the observed
    Hessian and the expected (Fisher) information, both defined in
    distributions7, or a choice settled against the family. The
    factorization that solves each step is passed as an object too, with its
    numerical tolerances.
  contents:
  - information_objects
  - auto_info
  - AutoInfo
  - iwls_solvers
  - solve_qr
  - solve_svd
  - solve_chol
  - IwlsSolver

- title: Where a fit begins
  desc: >
    A starting value given as a strategy and not as a vector of numbers, and
    evaluated once before the fit alternates. The default builds the start from
    intercept-only fits; the other strategies are procedures, from a random
    perturbation to a global search of the likelihood to the estimates of a
    model already fitted.
  contents:
  - start_strategy
  - start_at
  - start_intercepts
  - start_origin
  - start_random
  - start_search
  - start_from

- title: Reading a fit
  desc: >
    The log-likelihood, gradient and Hessian of the model as functions of the
    parameters and the data, the hyperparameters of a fit with their source,
    the certificate of convergence, the latent variables of a structural term,
    and a duration written in a readable unit.
  contents:
  - loglik
  - hyper
  - statmod_certificate
  - statmod_latent
  - format_duration

- title: Intervals of a prediction
  desc: >
    The argument `interval` of `predict()` takes an object that selects the
    uncertainty that the interval describes: the estimates alone, the estimates
    and the effects of a new group, or a new observation of the response. A
    prediction interval holds a second object that sets how the estimation
    uncertainty enters the predictive distribution.
  contents:
  - predict_intervals
  - interval_type
  - confidence_interval
  - group_interval
  - prediction_interval
  - predictive_distributions
  - predictive_type
  - pred_averaged
  - pred_plugin
  - pred_bootstrap

- title: Testing a coefficient
  desc: >
    One coefficient against one value, by Wald's statistic, the likelihood
    ratio, Rao's score or Terrell's gradient. `summary(test =)` reports the
    same four for every row against zero, and `confint(test =)` inverts them;
    `statmod_test()` also takes a null value other than zero. The test that a break-point exists is a separate function, which
    reads the supremum of a score process over the positions of the
    break-point.
  contents:
  - statmod_test
  - statmod_breakpoint_test

- title: Test statistics
  desc: >
    The four statistics with which a coefficient is tested, as objects passed
    to the argument `test` of `statmod_test()`, `summary()` and `confint()`:
    Wald's, the likelihood ratio, Rao's score and Terrell's gradient. The
    overview states the formula of each, what it needs and what it costs, and
    `test_restricted()` tells whether a statistic refits the model under the
    restriction.
  contents:
  - test_statistic
  - wald_test
  - lr_test
  - score_test
  - gradient_test
  - test_restricted

- title: Profile likelihood
  desc: >
    The penalized log-likelihood maximized over every coefficient but one or
    several that are held on a grid, returned as a data frame together with
    the value of the outer criterion where one ran. The grid of values is
    given by `profile_range()` or by the caller, and `profile_grid()` selects
    the exact method, one refit for each point.
  contents:
  - statmod_profile
  - profile_range
  - profile_method
  - profile_grid

- title: Variance conventions
  desc: >
    The three conventions for the variance matrix of the coefficients, as
    objects passed to the argument `type` of `vcov()`, `confint()`,
    `summary()`, `statmod_test()` and `predict()`: the Bayesian variance, the
    frequentist sandwich, and the unconditional variance that adds the
    uncertainty of the hyperparameters.
  contents:
  - vcov_method
  - bayesian_vcov
  - frequentist_vcov
  - hc0_sandwich
  - hc2_sandwich
  - statmod_leverage
  - hac_sandwich
  - unconditional_vcov
  - bootstrap_vcov

- title: Bootstrap
  desc: >
    The bootstrap variance of the coefficients: the schemes that resample the
    data, the function that stores the refitted replicates in a fit, and the
    extractor that reads them.
  contents:
  - resample_method
  - parametric_resample
  - case_resample
  - bayesian_resample
  - cluster_resample
  - add_bootstrap
  - statmod_bootstrap
  - StatmodBootstrap
  - bootstrap_interval

- title: Graphs of a fit
  desc: >
    `plot()` and `autoplot()` draw one aspect of a fit as a ggplot2 object.
    The graph is selected by an object passed as `type`, and its data are
    computed by `plot_data()` and drawn by `plot_layers()`, the two generics
    through which a new graph is added. Without a type, `plot()` draws the
    diagnostic graphs of `diagnostics()`.
  contents:
  - autoplot.StatmodFit
  - diagnostics
  - plot_type
  - default_plot
  - plot_data
  - plot_layers

- title: Graphs of a term
  desc: >
    Graphs of one term of one equation, selected by `term`: its effect with
    the partial residuals, and the graphs that describe a smooth, a
    penalized block, a random effect or a structural term.
  contents:
  - plot_effect
  - plot_derivative
  - plot_surface
  - plot_criterion
  - plot_shrinkage
  - plot_path
  - plot_caterpillar
  - plot_prior
  - plot_random_cov
  - plot_curves
  - plot_breakpoint
  - plot_filter
  - plot_news_impact
  - plot_states
  - plot_regime_density

- title: Graphs of the fitted distribution
  desc: >
    Graphs of the whole fitted distribution as a function of the covariates,
    without a term: a parameter with its band, the conditional quantile
    curves, the density at chosen covariate values and the moments.
  contents:
  - plot_param
  - plot_quantiles
  - plot_density
  - plot_moments

- title: Diagnostic graphs
  desc: >
    Graphs of the fit against the data, selected without `term`: the
    quantile residuals in a quantile-quantile graph, a worm plot, a histogram
    of the probability integral transform and a calibration graph, the
    residuals against a quantity or in order, the scores and the influence of
    the observations, and a comparison with simulated responses.
  contents:
  - plot_qq
  - plot_worm
  - plot_residuals
  - plot_pit
  - plot_calibration
  - plot_score
  - plot_influence
  - plot_acf
  - plot_ppc

- title: Installing and updating
  desc: >
    The toolkit is not on CRAN, so the install path is GitHub and the
    dependencies among the members are resolved by pak.
  contents:
  - statmodels7_update

- title: Internals
  desc: >
    The machinery from which the exported functions are built: the classes
    behind a fit, the methods registered for the generics of stats, and the
    helper functions. Using the package does not require any of it.
  contents:
  - has_keyword("internal")
